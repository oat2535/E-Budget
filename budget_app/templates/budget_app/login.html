{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <title>Login - E-Budget</title>
        <link href="{% static 'budget_app/css/styles.css' %}" rel="stylesheet" />
        <link rel="icon" type="image/jpeg" href="{% static 'budget_app/assets/img/coins.jpg' %}" />
        <script data-search-pseudo-elements defer src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/js/all.min.js" crossorigin="anonymous"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.29.0/feather.min.js" crossorigin="anonymous"></script>
        <!-- SweetAlert2 -->
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <style>
            body {
                background-color: #f4f6f9; /* Light grey background */
                /* Subtle dot pattern background */
                background-image: radial-gradient(#d1d8e0 1.5px, transparent 1.5px);
                background-size: 24px 24px;
                margin: 0;
                padding: 0;
            }
            
            /* Animations */
            @keyframes fadeInUp {
                from {
                    opacity: 0;
                    transform: translateY(30px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            /* White Navbar */
            .top-navbar {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 85px; /* Taller navbar */
                background-color: white;
                z-index: 10;
                display: flex;
                align-items: center;
                padding-left: 2rem;
                box-shadow: 0 0.15rem 1.75rem 0 rgba(33, 40, 50, 0.15);
            }
            
            .sidebar-bg {
                position: fixed;
                top: 85px; /* Start below navbar */
                left: 0;
                width: 12%;
                height: calc(100vh - 85px);
                z-index: -1;
            }
            
            .login-card-wrapper {
                min-height: 100vh;
                padding-top: 85px; /* Offset for navbar */
                margin-left: 12%; /* Offset for sidebar to perfectly center in remaining space */
                width: 88%;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            
            .login-card {
                width: 100%;
                max-width: 1000px; /* Wider card */
                border: none;
                border-radius: 0.75rem; 
                box-shadow: 0 1rem 4rem rgba(0, 0, 0, 0.15);
                z-index: 1;
                /* Apply fade in animation */
                animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            }
            
            .login-input {
                background-color: #e8f0fe !important;
                border: 2px solid transparent !important;
                border-radius: 50rem !important;
                padding: 1rem 1.5rem; /* Taller inputs */
                font-size: 1rem;
                transition: all 0.3s ease;
            }
            
            .login-input:focus {
                background-color: #ffffff !important;
                border-color: #b3d7ff !important;
                box-shadow: 0 0 0 0.25rem rgba(0, 118, 200, 0.15) !important;
                transform: translateY(-2px); /* Slight lift on focus */
            }
            
            .login-btn {
                border-radius: 50rem !important;
                padding: 0.9rem; /* Taller button */
                font-weight: 600;
                font-size: 1.1rem;
                background-color: #0076c8; /* Match standard blue */
                border: none;
                letter-spacing: 0.5px;
                transition: all 0.3s ease;
            }
            
            .login-btn:hover {
                background-color: #005a9c;
                transform: translateY(-2px); /* Lift button on hover */
                box-shadow: 0 0.5rem 1rem rgba(0, 118, 200, 0.3);
            }
            
            .login-btn:active {
                transform: translateY(0);
            }
        </style>
    </head>
    <body>
        <!-- Top Navbar -->
        <div class="top-navbar">
            <img src="{% static 'budget_app/assets/img/logo.png' %}" alt="Logo" style="height: 55px;">
        </div>
        
        <!-- The default SB Admin Pro gradient class for the sidebar -->
        <div class="sidebar-bg bg-primary bg-gradient-primary-to-secondary"></div>

        <div class="login-card-wrapper px-4">
            <div class="card login-card overflow-hidden">
                <div class="row g-0">
                    <!-- Left Side (Big Logo) -->
                    <div class="col-md-6 d-flex align-items-center justify-content-center p-4 bg-white">
                        <img src="{% static 'budget_app/assets/img/logo.png' %}" alt="Logo" class="img-fluid" style="max-width: 95%;">
                    </div>
                    
                    <!-- Right Side (Form) -->
                    <div class="col-md-6 d-flex align-items-center justify-content-center p-5 bg-white border-start">
                        <div class="w-100" style="max-width: 360px;">
                            <h2 class="text-center mb-4 fw-bolder" style="color: #2a3547 !important; letter-spacing: 0.5px;">E-Budget</h2>
                            
                            <form method="POST" action="{% url 'login' %}">
                                {% csrf_token %}
                                
                                <div class="mb-3">
                                    <input class="form-control login-input" name="employee_id" type="text" placeholder="Employee ID" required autocomplete="off" />
                                </div>
                                <div class="mb-4">
                                    <input class="form-control login-input" name="password" type="password" placeholder="••••" required />
                                </div>
                                <div class="d-grid mt-4">
                                    <button class="btn btn-primary login-btn" type="submit">Login</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <script src="{% static 'budget_app/js/scripts.js' %}"></script>
        
        {% if messages %}
            {% for message in messages %}
                <script>
                    document.addEventListener('DOMContentLoaded', function() {
                        Swal.fire({
                            icon: 'error',
                            title: 'เข้าสู่ระบบไม่สำเร็จ',
                            text: '{{ message }}',
                            confirmButtonColor: '#0076c8',
                            confirmButtonText: 'ตกลง'
                        });
                    });
                </script>
            {% endfor %}
        {% endif %}
    </body>
</html>
