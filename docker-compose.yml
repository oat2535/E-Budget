services:
  web:
    container_name: e-budget-web-prd
    image: e-budget-web-prd:latest
    build: .
    restart: unless-stopped
    ports:
      - "5895:8000"
    env_file:
      - .env
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      ENABLE_SECURE_SSL: ${ENABLE_SECURE_SSL:-False}
      DB_DEFAULT_NAME: ${DB_DEFAULT_NAME}
      DB_DEFAULT_USER: ${DB_DEFAULT_USER}
      DB_DEFAULT_PASSWORD: ${DB_DEFAULT_PASSWORD}
      DB_DEFAULT_HOST: ${DB_DEFAULT_HOST}
      DB_DEFAULT_PORT: ${DB_DEFAULT_PORT:-5435}
      DB_IMEDX_NAME: ${DB_IMEDX_NAME}
      DB_IMEDX_USER: ${DB_IMEDX_USER}
      DB_IMEDX_PASSWORD: ${DB_IMEDX_PASSWORD}
      DB_IMEDX_HOST: ${DB_IMEDX_HOST}
      DB_IMEDX_PORT: ${DB_IMEDX_PORT:-5434}
